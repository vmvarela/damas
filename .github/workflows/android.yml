name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build TWA APK/AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses + configure bubblewrap
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          # Bubblewrap/verification need build-tools;36.1.0 — install it explicitly.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.1.0" >/dev/null
          # bubblewrap validatePath exige tools/ o bin/ en la raiz del SDK y
          # jdkPath con fichero "release" (JAVA_VERSION="17.0").
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath": "%s", "androidSdkPath": "%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli@1.25.0

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > packaging/android/android-keystore

      - name: Build APK + AAB
        working-directory: packaging/android
        env:
          # PKCS12 protege la clave con el storepass: ambos deben coincidir.
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: bubblewrap build

      - name: Verify signing fingerprint
        run: |
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs packaging/android/app-release-signed.apk \
            | tee /tmp/damas-certs.txt | grep -qi "3624d4586648b4aec782c12421bf05b44022d1cd6fa9406fe6c80d199c048f3a" \
            || { cat /tmp/damas-certs.txt; echo "Fingerprint de firma no coincide con assetlinks.json"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: damas-android
          path: |
            packaging/android/app-release-signed.apk
            packaging/android/app-release-bundle.aab
            packaging/android/assetlinks.json

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            packaging/android/app-release-signed.apk
            packaging/android/app-release-bundle.aab
