name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build TWA APK/AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses + configure bubblewrap
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          # bubblewrap validatePath exige tools/ o bin/ en la raiz del SDK y
          # jdkPath con fichero "release" (JAVA_VERSION="17.0").
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath": "%s", "androidSdkPath": "%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > packaging/android/android-keystore

      - name: Build APK + AAB
        working-directory: packaging/android
        env:
          # PKCS12 protege la clave con el storepass: ambos deben coincidir.
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: bubblewrap build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: damas-android
          path: |
            packaging/android/app-release-signed.apk
            packaging/android/app-release-bundle.aab
            packaging/android/assetlinks.json

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/android/app-release-signed.apk
            packaging/android/app-release-bundle.aab
