name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js (for WASM tests)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: go test ./... -race -count=1

      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Build CLI
        run: go build -v ./cmd/damas

      - name: Build WASM
        run: GOOS=js GOARCH=wasm go build -o web/damas.wasm ./cmd/wasm

      - name: Run WASM tests
        run: go test -exec='$(go env GOROOT)/misc/wasm/wasm_exec.js' ./cmd/wasm