name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  ZIG_VERSION: "0.16.0"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — statically linked via musl, no system dependencies
          - target: x86_64-linux-musl
            asset: damas-x86_64-linux
            ext: ""
          - target: aarch64-linux-musl
            asset: damas-aarch64-linux
            ext: ""
          - target: arm-linux-musleabihf
            asset: damas-armv7-linux
            ext: ""
          - target: riscv64-linux-musl
            asset: damas-riscv64-linux
            ext: ""
          - target: x86-linux-musl
            asset: damas-x86-linux
            ext: ""
          # macOS — Zig bundles the macOS SDK for cross-compilation
          - target: x86_64-macos
            asset: damas-x86_64-macos
            ext: ""
          - target: aarch64-macos
            asset: damas-aarch64-macos
            ext: ""
          # Windows — MinGW ABI, no MSVC required
          - target: x86_64-windows-gnu
            asset: damas-x86_64-windows
            ext: ".exe"
          - target: aarch64-windows-gnu
            asset: damas-aarch64-windows
            ext: ".exe"
          - target: x86-windows-gnu
            asset: damas-x86-windows
            ext: ".exe"
          # FreeBSD — Zig bundles libc headers for cross-compilation
          - target: x86_64-freebsd
            asset: damas-x86_64-freebsd
            ext: ""
          - target: aarch64-freebsd
            asset: damas-aarch64-freebsd
            ext: ""
          # NetBSD
          - target: x86_64-netbsd
            asset: damas-x86_64-netbsd
            ext: ""
          - target: aarch64-netbsd
            asset: damas-aarch64-netbsd
            ext: ""

    steps:
      - uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zig build \
            -Dtarget=${{ matrix.target }} \
            -Doptimize=ReleaseSafe \
            -Dversion="$VERSION"

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp zig-out/bin/damas${{ matrix.ext }} dist/${{ matrix.asset }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  build-web:
    name: Build WASM web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build web
        run: zig build web -Doptimize=ReleaseSafe

      - name: Stage bundle
        run: |
          mkdir -p dist
          (cd zig-out/web && zip -r "$GITHUB_WORKSPACE/dist/damas-web.zip" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: damas-web
          path: dist/
          if-no-files-found: error

  release:
    name: Attach assets to release
    needs: [build, build-web]
    if: ${{ always() && needs.build.result != 'cancelled' && needs.build-web.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" --draft=false \
              --repo "${{ github.repository }}"
            gh release upload "${{ github.ref_name }}" artifacts/* \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              --repo "${{ github.repository }}" \
              artifacts/*
          fi

  # ── Publish to npm ─────────────────────────────────────────────────────
  # Requires:
  #   1. Package claimed on npmjs.com: @vmvarela/damas
  #   2. Trusted Publishing configured on npmjs.com for repo vmvarela/damas, workflow release.yml
  #   3. Repository variable NPM_TRUSTED_PUBLISHING=true set after configuring npm Trusted Publisher
  #   4. No NPM_TOKEN secret needed — uses OIDC (id-token: write)
  publish-npm:
    name: Publish to npm
    needs: release
    if: ${{ vars.NPM_TRUSTED_PUBLISHING == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Stage npm binaries
        run: |
          mkdir -p npm-pkg/bin
          cp -r packaging/npm/. npm-pkg/
          cp LICENSE npm-pkg/LICENSE
          cp artifacts/damas-x86_64-linux       npm-pkg/bin/damas-linux-x64
          cp artifacts/damas-aarch64-linux      npm-pkg/bin/damas-linux-arm64
          cp artifacts/damas-armv7-linux        npm-pkg/bin/damas-linux-arm
          cp artifacts/damas-x86_64-macos       npm-pkg/bin/damas-darwin-x64
          cp artifacts/damas-aarch64-macos      npm-pkg/bin/damas-darwin-arm64
          cp artifacts/damas-x86_64-windows.exe npm-pkg/bin/damas-win32-x64.exe
          chmod +x npm-pkg/bin/damas-linux-* npm-pkg/bin/damas-darwin-*

      - name: Set package version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --workspaces=false --prefix ./npm-pkg

      - name: Publish to npm
        run: npm publish ./npm-pkg --provenance --access public

  # ── Update Homebrew tap ─────────────────────────────────────────────
  # Requires:
  #   1. Repository: vmvarela/homebrew-tap (with a Formula/ directory)
  #   2. Secret: HOMEBREW_TAP_TOKEN (fine-grained PAT with contents:write
  #      on vmvarela/homebrew-tap, or classic PAT with public_repo scope)
  update-homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    env:
      HAS_HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Download all artifacts
        if: ${{ env.HAS_HOMEBREW_TOKEN == 'true' }}
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate formula and push to tap
        if: ${{ env.HAS_HOMEBREW_TOKEN == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          SHA_MACOS_ARM64=$(sha256sum artifacts/damas-aarch64-macos | awk '{print $1}')
          SHA_MACOS_X64=$(sha256sum artifacts/damas-x86_64-macos   | awk '{print $1}')
          SHA_LINUX_ARM64=$(sha256sum artifacts/damas-aarch64-linux | awk '{print $1}')
          SHA_LINUX_X64=$(sha256sum artifacts/damas-x86_64-linux   | awk '{print $1}')

          cat > damas.rb <<'FORMULA'
          class Damas < Formula
            desc "Checkers game: CLI, TUI and embedded web server in one binary"
            homepage "https://github.com/vmvarela/damas"
            version "__VERSION__"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/vmvarela/damas/releases/download/v__VERSION__/damas-aarch64-macos"
                sha256 "__SHA_MACOS_ARM64__"
              end
              on_intel do
                url "https://github.com/vmvarela/damas/releases/download/v__VERSION__/damas-x86_64-macos"
                sha256 "__SHA_MACOS_X64__"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/vmvarela/damas/releases/download/v__VERSION__/damas-aarch64-linux"
                sha256 "__SHA_LINUX_ARM64__"
              end
              on_intel do
                url "https://github.com/vmvarela/damas/releases/download/v__VERSION__/damas-x86_64-linux"
                sha256 "__SHA_LINUX_X64__"
              end
            end

            def install
              bin.install Dir["damas*"].first => "damas"
            end

            test do
              assert_match "damas", shell_output("#{bin}/damas --version 2>&1")
            end
          end
          FORMULA

          # Substitute placeholders with actual values
          sed -i "s/__VERSION__/${VERSION}/g"               damas.rb
          sed -i "s/__SHA_MACOS_ARM64__/${SHA_MACOS_ARM64}/g" damas.rb
          sed -i "s/__SHA_MACOS_X64__/${SHA_MACOS_X64}/g"     damas.rb
          sed -i "s/__SHA_LINUX_ARM64__/${SHA_LINUX_ARM64}/g" damas.rb
          sed -i "s/__SHA_LINUX_X64__/${SHA_LINUX_X64}/g"     damas.rb

          echo "==> Generated formula for damas ${VERSION}:"
          cat damas.rb

          # Push via GitHub Contents API — no git clone/push needed,
          # works with fine-grained PATs (contents:write on the tap repo).
          CURRENT_SHA=$(gh api "repos/vmvarela/homebrew-tap/contents/Formula/damas.rb" \
            --jq '.sha' 2>/dev/null || echo "")

          if [ -n "${CURRENT_SHA}" ]; then
            gh api "repos/vmvarela/homebrew-tap/contents/Formula/damas.rb" \
              --method PUT \
              -f "message=damas ${VERSION}" \
              -f "content=$(base64 -w0 damas.rb)" \
              -f "sha=${CURRENT_SHA}"
          else
            gh api "repos/vmvarela/homebrew-tap/contents/Formula/damas.rb" \
              --method PUT \
              -f "message=damas ${VERSION}" \
              -f "content=$(base64 -w0 damas.rb)"
          fi

  # ── Update AUR package ──────────────────────────────────────────────
  # Requires:
  #   1. AUR package registered: https://aur.archlinux.org/packages/damas
  #   2. Secret: AUR_SSH_KEY (SSH private key authorized on AUR)
  update-aur:
    name: Update AUR package
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          SHA_X86_64=$(sha256sum artifacts/damas-x86_64-linux  | awk '{print $1}')
          SHA_AARCH64=$(sha256sum artifacts/damas-aarch64-linux | awk '{print $1}')

          # Download LICENSE to compute its hash
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${GITHUB_REF_NAME}/LICENSE" -o LICENSE
          SHA_LICENSE=$(sha256sum LICENSE | awk '{print $1}')

          cat > PKGBUILD <<'PKGEOF'
          # Maintainer: vmvarela <vmvarela@gmail.com>
          pkgname=damas
          pkgver=__VERSION__
          pkgrel=1
          pkgdesc="Checkers game: CLI, TUI and embedded web server in one binary"
          arch=('x86_64' 'aarch64')
          url="https://github.com/vmvarela/damas"
          license=('MIT')
          provides=("${pkgname}")
          conflicts=("${pkgname}")

          source=("LICENSE::https://raw.githubusercontent.com/vmvarela/damas/v${pkgver}/LICENSE")
          sha256sums=('__SHA_LICENSE__')

          source_x86_64=("${pkgname}-${pkgver}-x86_64::https://github.com/vmvarela/damas/releases/download/v${pkgver}/damas-x86_64-linux")
          sha256sums_x86_64=('__SHA_X86_64__')

          source_aarch64=("${pkgname}-${pkgver}-aarch64::https://github.com/vmvarela/damas/releases/download/v${pkgver}/damas-aarch64-linux")
          sha256sums_aarch64=('__SHA_AARCH64__')

          package() {
              install -Dm755 "${pkgname}-${pkgver}-${CARCH}" "${pkgdir}/usr/bin/${pkgname}"
              install -Dm644 LICENSE "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"
          }
          PKGEOF

          # Substitute placeholders
          sed -i "s/__VERSION__/${VERSION}/g"         PKGBUILD
          sed -i "s/__SHA_LICENSE__/${SHA_LICENSE}/g"  PKGBUILD
          sed -i "s/__SHA_X86_64__/${SHA_X86_64}/g"   PKGBUILD
          sed -i "s/__SHA_AARCH64__/${SHA_AARCH64}/g" PKGBUILD

          echo "==> Generated PKGBUILD for damas ${VERSION}:"
          cat PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: damas
          pkgbuild: ./PKGBUILD
          commit_username: vmvarela
          commit_email: vmvarela@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"

  # ── Build and upload .deb packages ─────────────────────────────────
  # Generates Debian packages for amd64, arm64, arm7 and 386 using nfpm.
  # Each arch is independent — one failing arch does not block the others.
  package-deb:
    name: Package DEB (${{ matrix.goarch }})
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            asset: damas-x86_64-linux
          - goarch: arm64
            asset: damas-aarch64-linux
          - goarch: arm7
            asset: damas-armv7-linux
          - goarch: "386"
            asset: damas-x86-linux

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Install nfpm
        run: |
          NFPM_VERSION=2.45.1
          curl -sfL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm

      - name: Stage files for packaging
        run: |
          mkdir -p pkg-work
          cp artifacts/${{ matrix.asset }}  pkg-work/damas
          chmod +x pkg-work/damas
          cp LICENSE                         pkg-work/LICENSE

      - name: Build .deb
        working-directory: pkg-work
        env:
          VERSION: ${{ github.ref_name }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p dist
          VERSION="$VERSION" GOARCH="$GOARCH" \
            nfpm package -p deb \
              -f "$GITHUB_WORKSPACE/packaging/nfpm.yaml" \
              -t dist/

      - name: Upload .deb to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: pkg-work
        run: |
          gh release upload "${{ github.ref_name }}" dist/*.deb \
            --repo "${{ github.repository }}" \
            --clobber

  # ── Build and upload .rpm packages ─────────────────────────────────
  # Generates RPM packages for x86_64 and aarch64 using nfpm.
  # Each arch is independent — one failing arch does not block the other.
  package-rpm:
    name: Package RPM (${{ matrix.goarch }})
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            asset: damas-x86_64-linux
          - goarch: arm64
            asset: damas-aarch64-linux

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Install nfpm
        run: |
          NFPM_VERSION=2.45.1
          curl -sfL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm

      - name: Stage files for packaging
        run: |
          mkdir -p pkg-work
          cp artifacts/${{ matrix.asset }}  pkg-work/damas
          chmod +x pkg-work/damas
          cp LICENSE                         pkg-work/LICENSE

      - name: Build .rpm
        working-directory: pkg-work
        env:
          VERSION: ${{ github.ref_name }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p dist
          VERSION="$VERSION" GOARCH="$GOARCH" \
            nfpm package -p rpm \
              -f "$GITHUB_WORKSPACE/packaging/nfpm.yaml" \
              -t dist/

      - name: Upload .rpm to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: pkg-work
        run: |
          gh release upload "${{ github.ref_name }}" dist/*.rpm \
            --repo "${{ github.repository }}" \
            --clobber

  # ── Build and upload .apk packages ────────────────────────────────
  # Generates Alpine Linux packages for x86_64 and aarch64 using nfpm.
  # Each arch is independent — one failing arch does not block the other.
  package-apk:
    name: Package APK (${{ matrix.goarch }})
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            asset: damas-x86_64-linux
          - goarch: arm64
            asset: damas-aarch64-linux

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Install nfpm
        run: |
          NFPM_VERSION=2.45.1
          curl -sfL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm

      - name: Stage files for packaging
        run: |
          mkdir -p pkg-work
          cp artifacts/${{ matrix.asset }}  pkg-work/damas
          chmod +x pkg-work/damas
          cp LICENSE                         pkg-work/LICENSE

      - name: Build .apk
        working-directory: pkg-work
        env:
          VERSION: ${{ github.ref_name }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p dist
          VERSION="$VERSION" GOARCH="$GOARCH" \
            nfpm package -p apk \
              -f "$GITHUB_WORKSPACE/packaging/nfpm.yaml" \
              -t dist/

      - name: Upload .apk to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: pkg-work
        run: |
          gh release upload "${{ github.ref_name }}" dist/*.apk \
            --repo "${{ github.repository }}" \
            --clobber

  # ── Update WinGet manifest ────────────────────────────────────────
  # Submits a PR to microsoft/winget-pkgs with updated manifest files.
  # Requires:
  #   1. At least one version already in microsoft/winget-pkgs (initial
  #      submission must be done manually via wingetcreate or PR)
  #   2. Fork of microsoft/winget-pkgs under the vmvarela account
  #   3. Secret: WINGET_GITHUB_TOKEN (classic PAT with public_repo scope)
  update-winget:
    name: Update WinGet manifest
    needs: release
    runs-on: ubuntu-latest
    env:
      HAS_WINGET_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN != '' }}
    steps:
      - name: Submit WinGet manifest
        if: ${{ env.HAS_WINGET_TOKEN == 'true' }}
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: vmvarela.damas
          installers-regex: 'damas-.*-windows\.exe$'
          token: ${{ secrets.WINGET_GITHUB_TOKEN }}

  # ── Update Scoop bucket ──────────────────────────────────────────────
  # Pushes an updated Scoop manifest to the vmvarela/scoop-bucket
  # centralized bucket repository so Windows users can install via:
  #   scoop bucket add vmvarela https://github.com/vmvarela/scoop-bucket
  #   scoop install damas
  # Requires:
  #   1. Repository: vmvarela/scoop-bucket (with bucket/damas.json)
  #   2. Secret: SCOOP_BUCKET_TOKEN (PAT with contents:write on the bucket repo)
  update-scoop:
    name: Update Scoop bucket
    needs: release
    runs-on: ubuntu-latest
    env:
      HAS_SCOOP_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN != '' }}
    steps:
      - name: Download Windows artifacts
        if: ${{ env.HAS_SCOOP_TOKEN == 'true' }}
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate manifest and push to bucket
        if: ${{ env.HAS_SCOOP_TOKEN == 'true' }}
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          SHA_X64=$(sha256sum artifacts/damas-x86_64-windows.exe   | awk '{print $1}')
          SHA_X86=$(sha256sum artifacts/damas-x86-windows.exe      | awk '{print $1}')
          SHA_ARM64=$(sha256sum artifacts/damas-aarch64-windows.exe | awk '{print $1}')

          cat > damas.json <<MANIFEST
          {
              "version": "${VERSION}",
              "description": "Checkers game: CLI, TUI and embedded web server in one binary",
              "homepage": "https://github.com/vmvarela/damas",
              "license": "MIT",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/vmvarela/damas/releases/download/v${VERSION}/damas-x86_64-windows.exe#/damas.exe",
                      "hash": "${SHA_X64}"
                  },
                  "32bit": {
                      "url": "https://github.com/vmvarela/damas/releases/download/v${VERSION}/damas-x86-windows.exe#/damas.exe",
                      "hash": "${SHA_X86}"
                  },
                  "arm64": {
                      "url": "https://github.com/vmvarela/damas/releases/download/v${VERSION}/damas-aarch64-windows.exe#/damas.exe",
                      "hash": "${SHA_ARM64}"
                  }
              },
              "bin": "damas.exe",
              "checkver": "github",
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/vmvarela/damas/releases/download/v\$version/damas-x86_64-windows.exe#/damas.exe"
                      },
                      "32bit": {
                          "url": "https://github.com/vmvarela/damas/releases/download/v\$version/damas-x86-windows.exe#/damas.exe"
                      },
                      "arm64": {
                          "url": "https://github.com/vmvarela/damas/releases/download/v\$version/damas-aarch64-windows.exe#/damas.exe"
                      }
                  },
                  "hash": {
                      "url": "https://github.com/vmvarela/damas/releases/download/v\$version/sha256sums.txt"
                  }
              }
          }
          MANIFEST

          echo "==> Generated Scoop manifest for damas ${VERSION}:"
          cat damas.json

          git clone "https://x-access-token:${SCOOP_BUCKET_TOKEN}@github.com/vmvarela/scoop-bucket.git" scoop-repo
          mkdir -p scoop-repo/bucket
          cp damas.json scoop-repo/bucket/damas.json
          cd scoop-repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/damas.json
          git diff --cached --quiet || git commit -m "damas ${VERSION}"
          git push

  # ── Generate final SHA256 checksums ────────────────────────────────
  # Runs after all packaging jobs so sha256sums.txt covers all assets:
  # binaries, web bundle, .deb, .rpm and .apk packages.
  checksums:
    name: Generate SHA256 checksums
    needs: [release, package-deb, package-rpm, package-apk]
    if: >-
      always()
      && needs.release.result == 'success'
      && (needs.package-deb.result == 'success' || needs.package-deb.result == 'skipped')
      && (needs.package-rpm.result == 'success' || needs.package-rpm.result == 'skipped')
      && (needs.package-apk.result == 'success' || needs.package-apk.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir assets

      - name: Generate SHA256 checksums
        working-directory: assets
        run: |
          # Exclude any pre-existing sha256sums.txt to avoid self-referencing
          sha256sum $(ls | grep -v sha256sums.txt) | tee sha256sums.txt

      - name: Upload sha256sums.txt to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" assets/sha256sums.txt \
            --repo "${{ github.repository }}" \
            --clobber

  # ── Update Nix package versions ────────────────────────────────────
  # Pushes updated pkgs/damas/versions.json directly to
  # vmvarela/nix-packages so `nix run github:vmvarela/nix-packages#damas`
  # always points to the latest release.
  # Requires:
  #   1. Repository: vmvarela/nix-packages
  #   2. Secret: NIX_PACKAGES_TOKEN (PAT with contents:write on vmvarela/nix-packages)
  update-nix:
    name: Update Nix package
    needs: checksums
    runs-on: ubuntu-latest
    env:
      HAS_NIX_TOKEN: ${{ secrets.NIX_PACKAGES_TOKEN != '' }}
    steps:
      - name: Download sha256sums.txt
        if: ${{ env.HAS_NIX_TOKEN == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern sha256sums.txt \
            --dir .

      - name: Push updated versions.json to nix-packages
        if: ${{ env.HAS_NIX_TOKEN == 'true' }}
        env:
          NIX_PACKAGES_TOKEN: ${{ secrets.NIX_PACKAGES_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          SHA_X64_LINUX=$(awk '$2 == "damas-x86_64-linux"  { print $1 }' sha256sums.txt)
          SHA_A64_LINUX=$(awk '$2 == "damas-aarch64-linux" { print $1 }' sha256sums.txt)
          SHA_X64_MACOS=$(awk '$2 == "damas-x86_64-macos"  { print $1 }' sha256sums.txt)
          SHA_A64_MACOS=$(awk '$2 == "damas-aarch64-macos" { print $1 }' sha256sums.txt)

          cat > versions.json <<EOF
          {
            "x86_64-linux": {
              "url": "https://github.com/vmvarela/damas/releases/download/v${VERSION}/damas-x86_64-linux",
              "sha256": "${SHA_X64_LINUX}",
              "version": "${VERSION}"
            },
            "aarch64-linux": {
              "url": "https://github.com/vmvarela/damas/releases/download/v${VERSION}/damas-aarch64-linux",
              "sha256": "${SHA_A64_LINUX}",
              "version": "${VERSION}"
            },
            "x86_64-darwin": {
              "url": "https://github.com/vmvarela/damas/releases/download/v${VERSION}/damas-x86_64-macos",
              "sha256": "${SHA_X64_MACOS}",
              "version": "${VERSION}"
            },
            "aarch64-darwin": {
              "url": "https://github.com/vmvarela/damas/releases/download/v${VERSION}/damas-aarch64-macos",
              "sha256": "${SHA_A64_MACOS}",
              "version": "${VERSION}"
            }
          }
          EOF

          echo "==> Updated Nix versions.json for damas ${VERSION}:"
          cat versions.json

          git clone \
            "https://x-access-token:${NIX_PACKAGES_TOKEN}@github.com/vmvarela/nix-packages.git" \
            nix-repo
          cp versions.json nix-repo/pkgs/damas/versions.json
          cd nix-repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkgs/damas/versions.json
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore(damas): update to ${{ github.ref_name }}"
          git push

  # ── Update APT repository ──────────────────────────────────────────
  # Dispatches to vmvarela/apt-packages which rebuilds the signed APT index
  # and deploys to GitHub Pages so users can install via apt.
  # Requires:
  #   1. Repository: vmvarela/apt-packages (GitHub Pages enabled)
  #   2. Secret: APT_PACKAGES_TOKEN (PAT with contents:write on vmvarela/apt-packages)
  update-apt:
    name: Update APT repository
    needs: package-deb
    if: >-
      always()
      && needs.package-deb.result == 'success'
    runs-on: ubuntu-latest
    env:
      HAS_APT_TOKEN: ${{ secrets.APT_PACKAGES_TOKEN != '' }}
    steps:
      - name: Dispatch to apt-packages
        if: ${{ env.HAS_APT_TOKEN == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.APT_PACKAGES_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh api repos/vmvarela/apt-packages/dispatches \
            --method POST \
            -f event_type=update-damas \
            -F client_payload[version]="${VERSION}"
          echo "Dispatched update-damas v${VERSION} to vmvarela/apt-packages"

  # ── Update RPM repository ──────────────────────────────────────────
  # Dispatches to vmvarela/rpm-packages which rebuilds the signed RPM index
  # and deploys to GitHub Pages so users can install via dnf/yum.
  # Requires:
  #   1. Repository: vmvarela/rpm-packages (GitHub Pages enabled)
  #   2. Secret: RPM_PACKAGES_TOKEN (PAT with contents:write on vmvarela/rpm-packages)
  update-rpm:
    name: Update RPM repository
    needs: package-rpm
    if: >-
      always()
      && needs.package-rpm.result == 'success'
    runs-on: ubuntu-latest
    env:
      HAS_RPM_TOKEN: ${{ secrets.RPM_PACKAGES_TOKEN != '' }}
    steps:
      - name: Dispatch to rpm-packages
        if: ${{ env.HAS_RPM_TOKEN == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RPM_PACKAGES_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh api repos/vmvarela/rpm-packages/dispatches \
            --method POST \
            -f event_type=update-damas \
            -F client_payload[version]="${VERSION}"
          echo "Dispatched update-damas v${VERSION} to vmvarela/rpm-packages"

  # ── Update APK repository ──────────────────────────────────────────
  # Dispatches to vmvarela/apk-packages which rebuilds the signed APK index
  # and deploys to GitHub Pages so Alpine Linux users can install via apk.
  # Requires:
  #   1. Repository: vmvarela/apk-packages (GitHub Pages enabled)
  #   2. Secret: APK_PACKAGES_TOKEN (PAT with contents:write on vmvarela/apk-packages)
  update-apk:
    name: Update APK repository
    needs: package-apk
    if: >-
      always()
      && needs.package-apk.result == 'success'
    runs-on: ubuntu-latest
    env:
      HAS_APK_TOKEN: ${{ secrets.APK_PACKAGES_TOKEN != '' }}
    steps:
      - name: Dispatch to apk-packages
        if: ${{ env.HAS_APK_TOKEN == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.APK_PACKAGES_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh api repos/vmvarela/apk-packages/dispatches \
            --method POST \
            -f event_type=update-damas \
            -F client_payload[version]="${VERSION}"
          echo "Dispatched update-damas v${VERSION} to vmvarela/apk-packages"
