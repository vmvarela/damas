name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

autolabeler:
  - label: "enhancement"
    title:
      - "/^feat(\\(.+\\))?:/i"
  - label: "bug"
    title:
      - "/^fix(\\(.+\\))?:/i"
  - label: "github_actions"
    title:
      - "/^chore(\\(.+\\))?:/i"
      - "/^ci(\\(.+\\))?:/i"
      - "/^test(\\(.+\\))?:/i"
      - "/^refactor(\\(.+\\))?:/i"
      - "/^build(\\(.+\\))?:/i"
  - label: "documentation"
    title:
      - "/^docs(\\(.+\\))?:/i"

# release-drafter v7 ignores per-category `exclude-labels` (deprecated; only
# top-level works). `labels-mode: exactly` is the v7-native way to express the
# same intent: a PR only enters a category when its label set is exactly the
# configured one. Dependabot PRs carry both `github_actions` and `dependencies`,
# so they can never match Maintenance — they only match "Dependency Updates".
categories:
  - title: "🚀 Features"
    when:
      labels: ["enhancement"]
      labels-mode: "exactly"
  - title: "🐛 Bug Fixes"
    when:
      labels: ["bug"]
      labels-mode: "exactly"
  - title: "🧰 Maintenance"
    when:
      labels: ["github_actions"]
      labels-mode: "exactly"
  - title: "📝 Documentation"
    when:
      labels: ["documentation"]
      labels-mode: "exactly"
  - title: "⬆️ Dependency Updates"
    when:
      labels: ["dependencies"]

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'

version-resolver:
  minor:
    labels:
      - "enhancement"
  patch:
    labels:
      - "bug"
      - "github_actions"
      - "documentation"
  default: patch
